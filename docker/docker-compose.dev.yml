services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ixforge
      POSTGRES_PASSWORD: ixforge
      POSTGRES_DB: ixforge
    ports:
      - "5432:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ixforge"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata_dev:
