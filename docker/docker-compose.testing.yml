services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ixforge
      POSTGRES_PASSWORD: ixforge
      POSTGRES_DB: ixforge_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ixforge"]
      interval: 2s
      timeout: 5s
      retries: 5
