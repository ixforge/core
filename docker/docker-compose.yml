services:
  core:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: ["run"]
    ports:
      - "${IXFORGE_PORT:-8000}:8000"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - ixforge

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: ["worker"]
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ixforge

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ixforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ixforge}
      POSTGRES_DB: ${POSTGRES_DB:-ixforge}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ixforge}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - ixforge

volumes:
  pgdata:

networks:
  ixforge:
    driver: bridge
