services:
  core:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: ["run"]
    ports:
      - "${IXFORGE_PORT:-8000}:8000"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; r=urllib.request.urlopen('http://localhost:8000/api/v1/health'); exit(0 if r.getcode()==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - ixforge

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: ["worker"]
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0 if b'worker' in open('/proc/1/cmdline','rb').read() else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - ixforge

  portal:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: ["ui"]
    environment:
      IXFORGE_CORE_URL: http://core:8000
      IXFORGE_SECRET_KEY: ${IXFORGE_SECRET_KEY}
      IXFORGE_DEBUG: "false"
      IXFORGE_UI_SECURE_COOKIES: ${IXFORGE_UI_SECURE_COOKIES:-true}
    ports:
      - "8001:8001"
    depends_on:
      - core
    restart: unless-stopped
    networks:
      - ixforge

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ixforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ixforge}
      POSTGRES_DB: ${POSTGRES_DB:-ixforge}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ixforge}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - ixforge

volumes:
  pgdata:

networks:
  ixforge:
    driver: bridge
