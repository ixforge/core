[project]
name = "ixforge"
version = "0.1.0"
description = "Modular IXP management platform"
readme = "README.md"
authors = [
    { name = "Carlos Pizarro", email = "carlos@apoapsis.cl" }
]
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "structlog>=24.4",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "jinja2>=3.1",
    "procrastinate[asyncio]>=2.0",
    "httpx>=0.28",
    "prometheus-client>=0.21",
    "slowapi>=0.1",
    "cryptography>=44.0",
    "email-validator>=2.3.0",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    "factory-boy>=3.3",
    "ruff>=0.9",
    "mypy>=1.14",
]

[project.scripts]
ixforge = "ixforge.cli:main"

[build-system]
requires = ["uv_build>=0.10.2,<0.11.0"]
build-backend = "uv_build"

[tool.mypy]
strict = true
plugins = ["sqlalchemy.ext.mypy.plugin"]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["procrastinate.*", "slowapi.*", "jose.*", "passlib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
