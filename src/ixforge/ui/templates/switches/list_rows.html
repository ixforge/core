{% for s in switches %}
<tr class="hover:bg-gray-50 dark:hover:bg-gray-700/50">
  <td class="py-3">
    <a href="/admin/switches/{{ s.id }}" class="text-indigo-600 dark:text-indigo-400 hover:underline font-medium">
      {{ s.name }}
    </a>
  </td>
  <td class="py-3 text-sm">{{ s.hostname or "-" }}</td>
  <td class="py-3 text-sm"><code class="text-sm">{{ s.management_ip or "-" }}</code></td>
  <td class="py-3 text-sm">{{ s.vendor or "-" }}{% if s.model %} / {{ s.model }}{% endif %}</td>
  <td class="py-3">
    {% if s.is_active %}
    <span class="badge badge-green">Activo</span>
    {% else %}
    <span class="badge badge-red">Inactivo</span>
    {% endif %}
  </td>
  <td class="py-3">
    <div class="flex gap-2">
      <a href="/admin/switches/{{ s.id }}" class="text-sm text-indigo-600 dark:text-indigo-400 hover:underline">Ver</a>
      <a href="/admin/switches/{{ s.id }}/edit" class="text-sm text-gray-600 dark:text-gray-400 hover:underline">Editar</a>
    </div>
  </td>
</tr>
{% endfor %}
