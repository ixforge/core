{# Flash messages - auto-dismiss after 4 seconds #}
{% for msg in flash_messages %}
<div x-data="{ show: true }" x-show="show" x-init="setTimeout(() => show = false, 4000)"
     x-transition
     class="mb-4 p-4 rounded-lg flex justify-between items-center
            {% if msg.category == 'success' %}bg-green-100 text-green-800 dark:bg-green-900/50 dark:text-green-300
            {% elif msg.category == 'error' %}bg-red-100 text-red-800 dark:bg-red-900/50 dark:text-red-300
            {% elif msg.category == 'warning' %}bg-yellow-100 text-yellow-800 dark:bg-yellow-900/50 dark:text-yellow-300
            {% else %}bg-blue-100 text-blue-800 dark:bg-blue-900/50 dark:text-blue-300{% endif %}">
  <span>{{ msg.message }}</span>
  <button @click="show = false" class="ml-4 font-bold">&times;</button>
</div>
{% endfor %}
