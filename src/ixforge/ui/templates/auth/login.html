{% extends "layouts/auth.html" %}
{% block title %}Login - IXForge{% endblock %}
{% block content %}
<div class="w-full max-w-md">
  <div class="text-center mb-8">
    <h1 class="text-3xl font-bold text-gray-900 dark:text-white">IXForge</h1>
    <p class="mt-2 text-gray-600 dark:text-gray-400">Admin Portal</p>
  </div>
  <div class="card">
    {% if error %}
    <div class="mb-4 p-3 rounded-lg bg-red-100 text-red-800 dark:bg-red-900/50 dark:text-red-300 text-sm">
      {{ error }}
    </div>
    {% endif %}
    <form method="post" class="space-y-4">
      <div>
        <label for="email" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Email</label>
        <input type="email" name="email" id="email" required class="input-field" autofocus>
      </div>
      <div>
        <label for="password" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Password</label>
        <input type="password" name="password" id="password" required class="input-field">
      </div>
      <button type="submit" class="btn-primary w-full">Entrar</button>
    </form>
  </div>
</div>
{% endblock %}
